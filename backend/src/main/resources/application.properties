server.port=8080
spring.application.name=startuphub-backend

# CORS & Security
app.jwt.secret=StartupHubSuperSecretKeyForJWTTokenGeneration2026ProductionGradeKey!
app.jwt.expiration-ms=86400000

# Real Persistent File Database Storage on Disk (PostgreSQL Mode)
spring.datasource.url=jdbc:h2:file:./data/startuphub_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin_db_user
spring.datasource.password=StartupHubAdmin#SecurePass2026!
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring AI Configuration & Exclusions
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key-for-startuphub}
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
